[book]
title = "exr-rs"
description = "A pure-Rust OpenEXR port with a wgpu viewer and GPU-upload layer."
authors = ["Alex Khalyavin"]
language = "en"
src = "src"

[output.html]
# Served from GitHub Pages under /exr-rs/ (.github/workflows/pages.yml).
site-url = "/exr-rs/"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ssoj13/exr-rs"
edit-url-template = "https://github.com/ssoj13/exr-rs/edit/main/docs/book/src/{path}"
