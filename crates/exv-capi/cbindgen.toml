# Generates docs/exv-capi.h from src/capi.rs (the single source of truth for the C ABI).
# `cargo test -p exv-capi header_in_sync` regenerates in memory and fails on any drift;
# `EXV_BLESS_HEADER=1 cargo test -p exv-capi header_in_sync` rewrites the checked-in header.
language = "C"
cpp_compat = true
pragma_once = true
include_version = false
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
usize_is_size_t = true
documentation = true
documentation_style = "c99"
style = "both"
line_length = 110
tab_width = 2

header = """/*
 * Canonical C header of the exv_capi exported ABI (crates/exv-capi). GENERATED by cbindgen from
 * src/capi.rs -- do not edit by hand; see crates/exv-capi/CLAUDE.md for the regeneration command.
 *
 * Flat C functions over the pure-Rust EXV codec/video; the only FFI boundary of the project.
 * Conventions: every status-returning export is panic-safe (a Rust panic becomes
 * EXV_STATUS_INTERNAL, never an abort); handle/buffer out-pointers (`ExvSession**`, `ExvVideoEncoder**`,
 * `ExvBuffer**`) are NULL on error, info/meta structs are only written on success; paths are UTF-8 and may be
 * raw or file:// URLs (normalized in ONE place by the library -- do not pre-process them in the
 * host); float* buffers must be 4-byte aligned. `fmt` of exv_session_decode* is an ExvPixelFormat
 * value passed as uint32_t (a C enum is a signed int).
 */"""

trailer = """/* Struct layout pins -- mirrored by `const _: () = assert!(size_of::<..>() == N)` in capi.rs. */
#define EXV_CAT_(a, b) a##b
#define EXV_CAT(a, b) EXV_CAT_(a, b)
#if defined(__cplusplus)
#define EXV_STATIC_ASSERT(c, m) static_assert(c, m)
#elif defined(__STDC_VERSION__) && __STDC_VERSION__ >= 201112L
#define EXV_STATIC_ASSERT(c, m) _Static_assert(c, m)
#else
/* Pre-C11 / MSVC default C mode: a negative array size fails the build the same way. */
#define EXV_STATIC_ASSERT(c, m) typedef char EXV_CAT(exv_static_assert_, __LINE__)[(c) ? 1 : -1]
#endif
EXV_STATIC_ASSERT(sizeof(ExvVersion) == 8, "ExvVersion layout");
EXV_STATIC_ASSERT(sizeof(ExvStreamInfo) == 16, "ExvStreamInfo layout");
EXV_STATIC_ASSERT(sizeof(ExvFrameInfo) == 12, "ExvFrameInfo layout");
EXV_STATIC_ASSERT(sizeof(ExvMeta) == 32, "ExvMeta layout");
EXV_STATIC_ASSERT(sizeof(ExvEncParams) == 32, "ExvEncParams layout");
#undef EXV_STATIC_ASSERT
#undef EXV_CAT
#undef EXV_CAT_"""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false

[export]
# Enums used only as value sets (the ABI passes them as plain uint32_t) must still be emitted.
include = ["ExvPixelFormat", "ExvDtype", "ExvCodec", "ExvCodecMode", "ExvMetaFlag"]
