[package]
name = "exv-format"
description = "EXV container: LE-TLV header, CodecId+params, TileGrid/TileIndex, track/GOP schema, deep/multipart/mip."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "exv_format"
path = "src/format.rs"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]

[dependencies]
bytemuck.workspace = true
exr-core = { path = "../exr-core" }
imath-rs = { path = "../imath-rs" }
memmap2.workspace = true
rayon = { workspace = true, optional = true }
tempfile = "3"
