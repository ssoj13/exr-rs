# Cryptomatte decode (and encode) on top of exr-core.
[package]
name = "cryptomatte"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cryptomatte ID matte decode/encode helpers for exr-rs"
keywords = ["cryptomatte", "exr", "openexr", "vfx", "matte"]
categories = ["multimedia::images", "graphics"]
publish = false

[dependencies]
exr-core = { path = "../exr-core" }
imath-rs = { path = "../imath-rs" }
murmur3 = { workspace = true }
log = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
# Test-only instrumentation (e.g. `matte::channel_as_f32`'s call counter, used
# to turn a wall-clock complexity test into a build-mode/load-independent
# operation-count ratio — see `tests/inject.rs`). Never enabled in a normal
# build; enabled unconditionally for `cargo test` via the self-referential
# dev-dependency below so no test is ever silently skipped for lack of a flag.
test-instrumentation = []
# Run the tests that read the private sample set (`exr-test-data`); off by default.
test-data = []

[dev-dependencies]
cryptomatte = { path = ".", features = ["test-instrumentation"] }
# Locates Psyop's sample images and the pixel goldens.
exr-test-data = { workspace = true }
# Scratch directories that remove themselves (the cryptomatte tests).
tempfile = "3"
